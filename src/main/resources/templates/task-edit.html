<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Tarea</title>
    <link rel="icon" type="image/x-icon" th:href="@{/img/logo_taskmanager.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .form-floating {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .form-floating label {
            opacity: 0.7;
            transition: all 0.2s;
            color: #333; /* Asegurar que las etiquetas sean oscuras */
        }
        .form-control, .form-select {
            background-color: rgba(245, 245, 247, 0.8);
            border: 1px solid #e6e6e6;
            border-radius: 12px;
            padding: 1rem 1rem;
            font-size: 1rem;
            transition: all 0.3s;
            height: 58px;
            box-shadow: none;
            color: #333; /* Color de texto oscuro para los inputs */
        }
        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }
        /* Estilo para el placeholder */
        ::placeholder {
            color: #333 !important;
            opacity: 0.7 !important;
        }
        textarea.form-control {
            height: auto;
            min-height: 120px;
            resize: none;
        }
        .task-form-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s;
        }
        .task-form-header {
            padding: 1.8rem 2rem 1rem;
            background: linear-gradient(135deg, #0071e3, #44a4ff);
            color: white;
            border: none;
        }
        .task-form-body {
            padding: 2rem;
        }
        .form-buttons {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
        }
        .btn-save {
            background: linear-gradient(135deg, #0071e3, #44a4ff);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 113, 227, 0.3);
        }
        .btn-cancel {
            background-color: rgba(255, 59, 48, 0.1); /* Fondo rojo transparente */
            border: none;
            color: #ff3b30; /* Color rojo de texto */
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .btn-cancel:hover {
            transform: translateY(-3px);
            background-color: rgba(255, 59, 48, 0.2); /* Fondo rojo más intenso al hover */
            box-shadow: 0 5px 15px rgba(255, 59, 48, 0.2);
        }
        .header-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .form-header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .header-subtitle {
            opacity: 0.8;
            font-weight: 400;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <!-- Incluir la barra de navegación -->
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="task-form-card animate__animated animate__fadeIn">
                    <div class="task-form-header">
                        <div class="form-header-content">
                            <i class="bi bi-pencil-square header-icon"></i>
                            <h2 class="mb-0 fw-bold">Editar Tarea</h2>
                            <p class="header-subtitle">Actualiza los datos de tu tarea</p>
                        </div>
                    </div>
                    <div class="task-form-body">
                        <form th:action="@{/tasks/update/{id}(id=${taskId})}" th:object="${task}" method="post">
                            <div class="form-floating mb-4">
                                <input type="text" class="form-control" id="title" th:field="*{title}" placeholder="Título" required>
                                <label for="title">Título</label>
                            </div>
                            
                            <div class="form-floating mb-4">
                                <textarea class="form-control" id="description" th:field="*{description}" placeholder="Descripción"></textarea>
                                <label for="description">Descripción</label>
                            </div>
                            
                            <div class="form-floating mb-4">
                                <select class="form-select" id="status" th:field="*{status}" required>
                                    <option th:each="statusOption : ${statuses}" 
                                            th:value="${statusOption}" 
                                            th:text="${statusOption}"
                                            th:selected="${statusOption == task.status}">
                                        Estado
                                    </option>
                                </select>
                                <label for="status">Estado</label>
                            </div>
                            
                            <div class="form-floating mb-4">
                                <input type="date" class="form-control" id="dueDate" th:field="*{dueDate}" placeholder="Fecha Límite">
                                <label for="dueDate">Fecha Límite</label>
                            </div>
                            
                            <div class="form-buttons">
                                <button type="submit" class="btn btn-save flex-grow-1">
                                    <i class="bi bi-check-circle me-2"></i> Actualizar Tarea
                                </button>
                                <a href="/" class="btn btn-cancel">
                                    <i class="bi bi-x-circle me-2"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Footer -->
                <footer class="mt-5 mb-4 text-center text-muted small">
                    <p><span class="fw-bold" href="https://www.brundindev-portfolio.vercel.app">brundindev</span> © 2025 Gestor de Tareas · Desarrollado con <i class="bi bi-heart-fill text-danger"></i>, Java y Spring Boot.</p>
                </footer>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
