<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" th:href="@{/img/logo_taskmanager.ico}">
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-check-circle-fill me-2" style="color: var(--apple-blue);"></i>
                <span style="font-weight: 600;">Gestor de Tareas</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-house-door me-1"></i>Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tasks/new}">
                            <i class="bi bi-plus-circle me-1"></i>Nueva Tarea
                        </a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center">
                    <!-- Switch para cambio de tema -->
                    <div class="theme-switch-wrapper me-3">
                        <label class="theme-switch" for="theme-toggle">
                            <input type="checkbox" id="theme-toggle" />
                            <div class="slider round">
                                <i class="bi bi-sun-fill theme-icon-light"></i>
                                <i class="bi bi-moon-fill theme-icon-dark"></i>
                            </div>
                        </label>
                    </div>

                    <div sec:authorize="isAuthenticated()" class="dropdown">
                        <button class="btn dropdown-toggle glass-effect" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-1" style="color: var(--apple-blue);"></i>
                            <span sec:authentication="name" class="fw-medium">Usuario</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" style="border-radius: var(--border-radius);">
                            <li>
                                <span class="dropdown-item-text text-muted small ps-3 py-1">
                                    <i class="bi bi-person-badge me-1"></i>
                                    Sesión iniciada como <span sec:authentication="name"></span>
                                </span>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Mi Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="dropdown-item p-0">
                                    <button type="submit" class="btn btn-link text-decoration-none text-danger w-100 text-start px-3 py-2">
                                        <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                    
                    <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                        <a th:href="@{/login}" class="btn glass-effect">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
                        </a>
                        <a th:href="@{/registro}" class="btn btn-primary">
                            <i class="bi bi-person-plus me-1"></i>Registrarse
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
