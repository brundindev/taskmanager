<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Tarea</title>
    <link rel="icon" type="image/x-icon" th:href="@{/img/logo_taskmanager.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/crearTarea.css}">
</head>
<body>
    <!-- Incluir la barra de navegación -->
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="task-form-card animate__animated animate__fadeIn">
                    <div class="task-form-header">
                        <div class="form-header-content">
                            <i class="bi bi-plus-circle header-icon"></i>
                            <h2 class="mb-0 fw-bold">Nueva Tarea</h2>
                            <p class="header-subtitle">Crea una nueva tarea para organizar tus actividades</p>
                        </div>
                    </div>
                    <div class="task-form-body">
                        <form th:action="@{/tasks/save}" th:object="${task}" method="post">
                            <div class="form-floating mb-4">
                                <input type="text" class="form-control" id="title" th:field="*{title}" placeholder="Título" required>
                                <label for="title">Título</label>
                            </div>
                            
                            <div class="form-floating mb-4">
                                <textarea class="form-control" id="description" th:field="*{description}" placeholder="Descripción"></textarea>
                                <label for="description">Descripción</label>
                            </div>
                            
                            <div class="form-floating mb-4">
                                <select class="form-select" id="status" th:field="*{status}" required>
                                    <option th:each="statusOption : ${statuses}" 
                                            th:value="${statusOption}" 
                                            th:text="${statusOption}">
                                        Estado
                                    </option>
                                </select>
                                <label for="status">Estado</label>
                            </div>
                            
                            <div class="form-floating mb-4">
                                <input type="date" class="form-control" id="dueDate" th:field="*{dueDate}" placeholder="Fecha Límite">
                                <label for="dueDate">Fecha Límite</label>
                            </div>
                            
                            <div class="form-buttons">
                                <button type="submit" class="btn btn-save flex-grow-1">
                                    <i class="bi bi-check-circle me-2"></i> Guardar Tarea
                                </button>
                                <a href="/" class="btn btn-cancel">
                                    <i class="bi bi-x-circle me-2"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Footer -->
                <footer class="mt-5 mb-4 text-center text-muted small">
                    <p><span class="fw-bold" href="https://www.brundindev-portfolio.vercel.app">brundindev</span> © 2025 Gestor de Tareas · Desarrollado con <i class="bi bi-heart-fill text-danger"></i>, Java y Spring Boot.</p>
                </footer>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
